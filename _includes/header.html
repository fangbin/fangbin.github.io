<header class="site-header">
  <div class="container">
    <nav class="site-nav">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.author | escape }}</a>

      <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span class="hamburger"></span>
      </button>

      <ul class="nav-links">
        {% if page.lang == 'en' %}
        <li><a href="{{ '/index-en.html' | relative_url }}"{% if page.url == '/index-en.html' %} class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/index-en.html' | relative_url }}#about">About Me</a></li>
        <li><a href="{{ '/index-en.html' | relative_url }}#experience">Experiences</a></li>
        <li><a href="{{ '/index-en.html' | relative_url }}#publications">Publications</a></li>
        <li><a href="{{ '/index-en.html' | relative_url }}#projects">Projects</a></li>
        <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
        {% else %}
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>首页</a></li>
        <li><a href="{{ '/' | relative_url }}#about">关于我</a></li>
        <li><a href="{{ '/' | relative_url }}#experience">经历</a></li>
        <li><a href="{{ '/' | relative_url }}#publications">论文</a></li>
        <li><a href="{{ '/' | relative_url }}#projects">项目</a></li>
        <li><a href="{{ '/blog/' | relative_url }}">博客</a></li>
        {% endif %}
        <li class="lang-switcher">
          <a href="{{ '/' | relative_url }}"{% if page.lang != 'en' %} class="active"{% endif %}>ZH</a>
          <a href="{{ '/index-en.html' | relative_url }}"{% if page.lang == 'en' %} class="active"{% endif %}>EN</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
